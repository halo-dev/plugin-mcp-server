plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.8.0"
}

group 'run.halo.mcpserver'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.26.0')
    implementation project(':api')
    implementation('io.modelcontextprotocol.sdk:mcp:2.0.0') {
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'io.projectreactor'
        exclude group: 'org.slf4j'
        exclude group: 'tools.jackson.core'
        exclude group: 'tools.jackson.dataformat'
    }
    implementation('org.springframework.ai:mcp-spring-webflux:2.0.0') {
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'io.projectreactor'
        exclude group: 'org.slf4j'
        exclude group: 'org.springframework'
    }
    compileOnly 'run.halo.app:api'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

tasks.named('jar') {
    dependsOn(':api:jar')
}

tasks.register('processUiResources', Copy) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/ui')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}

halo {
    version = '2.26'
}

haloPlugin {
    openApi {
        outputDir = file("$rootDir/api-docs/openapi/v3_0")
        groupingRules {
            mcpV1alpha1Api {
                displayName = 'Console API for MCP Server'
                pathsToMatch = [
                    '/apis/console.api.mcp.halo.run/v1alpha1/**'
                ]
            }
        }
        groupedApiMappings = [
                '/v3/api-docs/mcpV1alpha1Api': 'mcpV1alpha1Api.json'
        ]
        generator {
            outputDir = file("${projectDir}/ui/src/api/generated")
        }
    }
}
