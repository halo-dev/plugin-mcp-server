plugins {
    id 'java'
    id 'com.diffplug.spotless' version '8.10.2'
    id 'io.freefair.lombok' version '9.8.2'
    id 'run.halo.plugin.devtools' version '0.8.0'
}

group = 'run.halo.mcpserver.examples'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly platform('run.halo.tools.platform:plugin:2.26.0')
    compileOnly 'run.halo.app:api'
    compileOnly 'io.projectreactor:reactor-core'
    compileOnly files('../../api/build/libs/api-1.3.0-SNAPSHOT.jar')

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

spotless {
    java {
        palantirJavaFormat('2.103.0').formatJavadoc(true)
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

halo {
    version = '2.26'
}
